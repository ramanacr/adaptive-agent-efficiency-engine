# cargo-deny policy (SEC-015). CI runs `cargo deny check` on every push.

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable or yanked crates fail the check; unmaintained ones warn.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only (the project is MIT).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
