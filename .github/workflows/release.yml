name: release

# Tag push `vX.Y.Z` (must equal the workspace version): build, package, attest and create a
# DRAFT GitHub Release for the owner to review and publish.
# Manual run (workflow_dispatch): same build and packaging, uploaded as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, run: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aaes-cli") | .version')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match version v$v"; exit 1; fi
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p aaes-cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: target/${{ matrix.target }}/release/aaes --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/aaes
            target/${{ matrix.target }}/release/aaes.exe
          if-no-files-found: error

  universal:
    name: macOS universal binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*-apple-darwin
      - run: |
          mkdir -p out
          lipo -create bin-x86_64-apple-darwin/aaes bin-aarch64-apple-darwin/aaes -output out/aaes
          chmod +x out/aaes
          lipo -info out/aaes
          out/aaes --version
      - uses: actions/upload-artifact@v4
        with:
          name: bin-universal-apple-darwin
          path: out/aaes
          if-no-files-found: error

  package:
    name: package and release
    needs: [build, universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # draft release
      id-token: write      # Sigstore signing for build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
      - name: Archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir dist
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            d=$(mktemp -d); cp bin-$t/aaes.exe LICENSE README.md "$d/"
            (cd "$d" && zip -q -9 "$GITHUB_WORKSPACE/dist/aaes-v$v-$t.zip" aaes.exe LICENSE README.md)
          done
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl universal-apple-darwin; do
            d=$(mktemp -d); cp bin-$t/aaes LICENSE README.md "$d/"; chmod +x "$d/aaes"
            tar -C "$d" -czf "dist/aaes-v$v-$t.tar.gz" aaes LICENSE README.md
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/aaes-v${{ env.VERSION }}.spdx.json
          upload-artifact: false
      - name: Build provenance (Sigstore)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes \
            --title "AAES $GITHUB_REF_NAME"
