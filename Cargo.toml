[workspace]
resolver = "3"
members = ["crates/aaes-cli", "crates/aaes-transcripts", "spikes/hook-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ramanacr/adaptive-agent-efficiency-engine"
authors = ["Ramana Reddy Chamakura"]

[workspace.dependencies]
aaes-transcripts = { path = "crates/aaes-transcripts" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hot-path binaries are started once per agent tool call: optimise for size and start-up.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
