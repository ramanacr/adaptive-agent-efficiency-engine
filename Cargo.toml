[workspace]
resolver = "3"
members = ["crates/aaes-core", "crates/aaes-runtime", "crates/aaes-cli", "crates/aaes-transcripts", "spikes/hook-probe"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ramanacr/adaptive-agent-efficiency-engine"
authors = ["Ramana Reddy Chamakura"]

[workspace.dependencies]
aaes-core = { path = "crates/aaes-core", version = "0.1.2" }
aaes-runtime = { path = "crates/aaes-runtime", version = "0.1.2" }
aaes-transcripts = { path = "crates/aaes-transcripts", version = "0.1.2" }
getrandom = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hot-path binaries are started once per agent tool call: optimise for size and start-up.
# panic = "unwind" (default) so a bug in a handler is caught, logged and fails open (hook::handle_safe).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
