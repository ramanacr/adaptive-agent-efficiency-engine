[package]
name = "aaes-cli"
description = "AAES command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aaes"
path = "src/main.rs"

[dependencies]
aaes-core.workspace = true
aaes-runtime.workspace = true
aaes-transcripts.workspace = true
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true

# `cargo binstall aaes-cli` downloads the release archive instead of compiling (FUN-023).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/aaes-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aaes-v{ version }-universal-apple-darwin.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aaes-v{ version }-universal-apple-darwin.tar.gz"
