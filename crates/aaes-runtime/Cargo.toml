[package]
name = "aaes-runtime"
description = "AAES runtime: hook handling, session state, artifact store, HTTP hook server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aaes-core.workspace = true
getrandom.workspace = true
serde_json.workspace = true
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# SEC-012 key wrapping: macOS Keychain (native read) and the Linux kernel user keyring.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = "0.2"

[lints]
workspace = true
